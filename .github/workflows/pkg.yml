name: Package Preview

# Builds, packs, and publishes preview packages from the job that built them.
# Same-repo runs prove themselves to the registry with the job's OIDC token.
# Fork pull requests get no OIDC token from GitHub; for those the registry
# verifies through the GitHub API that the named run is in progress on a
# fork, and only ever tags under that run's own pull request.

on:
  push:
    branches: [main]
    paths:
      - "submodules/distilled"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - ".github/workflows/pkg.yml"
  pull_request:
    paths:
      - "submodules/distilled"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - ".github/workflows/pkg.yml"

# id-token is only granted to same-repo runs; fork pull requests silently get
# none and fall back to run verification.
permissions:
  contents: read
  id-token: write

concurrency:
  group: pkg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    name: Publish preview packages
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pack the pull request head rather than the synthetic merge commit,
          # so every tarball is addressed by a commit that exists on the PR.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout distilled
        run: git submodule update --init --depth=1 --checkout -- submodules/distilled

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.repository_id }}-${{ github.sha }}-${{ github.workflow }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.repository_id }}-${{ github.sha }}-
            turbo-${{ runner.os }}-${{ github.repository_id }}-

      - name: Setup pnpm, Node.js, Bun and install dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: true
          require-lockfile: true

      - name: Build packages
        run: pnpm build:pkg

      # Keep the directory lists in sync with the `build:pkg` script.
      - name: Publish packages
        run: >-
          bun packages/pkg/src/cli/bin.ts publish
          --group 'Alchemy=./packages/{alchemy,better-auth,cloudflare-runtime,frontend-frameworks,node-utils,floci,pkg}'
          --group 'Distilled=./submodules/distilled/packages/{core,aws,axiom,cloudflare,fly-io,hetzner,neon,planetscale,railway}'
          --registry https://staging.pkg.ing

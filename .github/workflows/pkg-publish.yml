name: Package Preview Publish

# Publishes the artifact produced by `pkg-build.yml`. This workflow always
# runs from the default branch with the repository's own OIDC identity and
# never checks out the code that produced the artifact, so a fork pull request
# can be published without any of its code executing here. The registry
# resolves the triggering run through the GitHub API and derives every tag
# from what GitHub reports, not from anything in the artifact.

on:
  workflow_run:
    workflows: ["Package Preview Build"]
    types: [completed]

permissions:
  id-token: write
  actions: read

concurrency:
  group: pkg-publish-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish preview packages
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Default branch checkout: only the `pkg` CLI source is needed here.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm, Node.js, Bun
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-preview
          path: .pkg
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish packages
        run: >-
          bun packages/pkg/src/cli/bin.ts publish
          --run ${{ github.event.workflow_run.id }}
          --registry https://staging.pkg.ing
